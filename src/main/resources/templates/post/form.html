
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head('Post')"></head>
<body>
<nav th:replace="base :: navbar"></nav>

<div class="container mt-3">
    <h2 th:text="${post.id_Post == 0 ? 'Nuevo Post' : 'Editar Post'}">Nuevo/Editar</h2>
    <hr/>
    <form method="post" th:action="@{/post/guardar}" th:object="${post}">
        <input type="hidden" th:field="*{id_Post}" />
        <div class="form-group">
            <label>Título</label>
            <input type="text" class="form-control" th:field="*{title}" maxlength="75" required>
        </div>
        <div class="form-group">
            <label>Resumen</label>
            <input type="text" class="form-control" th:field="*{summary}" maxlength="255">
        </div>
        <div class="form-group">
            <label>Contenido</label>
            <textarea class="form-control" rows="6" th:field="*{content}"></textarea>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" th:field="*{published}">
            <label class="form-check-label">Publicado</label>
        </div>
        <a th:href="@{/post}" class="btn btn-danger">Cancelar</a>
        <button type="submit" class="btn btn-primary"
                th:text="${post.id_Post == 0 ? 'Registrar' : 'Actualizar'}">Reg/act</button>
    </form>
</div>
</body>
</html>
