<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head('Posts')"></head>
<body>
<nav th:replace="base :: navbar"></nav>

<div class="container mt-3">
    <h3>Lista de Posts</h3>

    <div th:if="${msg != null}" th:text="${msg}" class="alert alert-success"></div>
    <div th:if="${error != null}" th:text="${error}" class="alert alert-danger"></div>

    <table class="table table-bordered table-sm">
        <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Resumen</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${lista}">
            <td th:text="${p.id_Post}"></td>
            <td th:text="${p.title}"></td>
            <td th:text="${p.user.firstname + ' ' + p.user.lastname}"></td>
            <td th:text="${p.summary}"></td>
            <td th:text="${p.published ? 'Publicado' : 'Borrador'}"></td>
            <td>
                <!-- Planteamos que solo puede editar el admin o el dueño del post -->
                <a th:if="${session.rol == 'admin' or (session.usuario != null and p.user.id_user == session.usuario.id_user)}"
                   th:href="@{/post/edit(id=${p.id_Post})}" class="btn btn-primary btn-sm">Editar</a>

                <!-- PLanteamos que solo el admin elimine-->
                <form th:if="${session.rol == 'admin'}" th:action="@{/post/borrar}" method="post" style="display:inline">
                    <input type="hidden" name="id" th:value="${p.id_Post}" />
                    <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Eliminar este post?')">Eliminar</button>
                </form>


                <span th:if="${session.usuario != null and p.user.id_user != session.usuario.id_user}">
                    <span th:if="${idsRelacionados.contains(p.user.id_user)}" class="badge badge-secondary">Solicitud existente</span>
                    <form th:unless="${idsRelacionados.contains(p.user.id_user)}" th:action="@{/amistad/enviar}" method="post" style="display:inline">
                        <input type="hidden" name="idReceptor" th:value="${p.user.id_user}" />
                        <button type="submit" class="btn btn-info btn-sm">Agregar amigo</button>
                    </form>
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
