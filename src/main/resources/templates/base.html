<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/custom.css}" />
    <script th:src="@{/js/jquery-3.4.1.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <title th:text="${titulo} ? ${titulo} : 'Laboratorio 5'">Laboratorio 5</title>
</head>
<body><!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/custom.css}" />
    <script th:src="@{/js/jquery-3.4.1.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <title th:text="${titulo} ? ${titulo} : 'Laboratorio 8'">Laboratorio 8</title>
</head>
<body>
<nav class="navbar navbar-dark bg-dark navbar-expand-sm fixed-top justify-content-between" th:fragment="navbar">
    <a class="navbar-brand" th:href="@{/post}">Blog Telecom</a>
    <ul class="navbar-nav mr-auto">
        <li class="nav-item">
            <a class="nav-link" th:href="@{/post}">Listar posts</a>
        </li>
        <li class="nav-item" th:if="${session.rol == 'admin' or session.rol == 'user'}">
            <a class="nav-link" th:href="@{/post/create}">Crear post</a>
        </li>
        <li class="nav-item" th:if="${session.rol == 'admin' or session.rol == 'user'}">
            <a class="nav-link" th:href="@{/amistad}">Mis solicitudes</a>
        </li>
    </ul>

    <div class="d-inline-flex">
        <div th:if="${session.usuario == null}">
            <a th:href="@{/loginForm}" class="btn btn-info">Iniciar Sesión</a>
        </div>
        <div th:if="${session.usuario != null}" class="d-flex align-items-center">
                <span class="text-white mr-2"
                      th:text="|Bienvenido ${session.usuario.firstname} ${session.usuario.lastname} (${session.rol})|">Bienvenido</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-info">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
    <nav class="navbar navbar-dark bg-dark navbar-expand-sm fixed-top justify-content-between" th:fragment="navbar">
        <!-- Links -->
        <ul class="navbar-nav">
            <a class="navbar-brand" href="#">Blog Telecom</a>
            <li class="nav-item" >
                <a class="nav-link"  th:href="@{'/post'}">listar post</a>
            </li>
            <li class="nav-item" th:if="${session.rol == 'admin'}">
                <a class="nav-link" th:href="@{'/user/list'}">listar usuarios</a>
            </li>
            <li class="nav-item" th:if="${session.rol == 'admin' or session.rol == 'user'}">
                <a class="nav-link" th:href="@{'/user'}">ver mi perfil</a>
            </li>
            <li class="nav-item" th:if="${session.rol == 'admin' or session.rol == 'user'}">
                <a class="nav-link" th:href="@{'/post/create'}">Crear post</a>
            </li>
        </ul>

        <div class="d-inline-flex">
            <div th:if="${session.usuario == null}" id="usuarioAnonimo">
                <a th:href="@{/loginForm}" class="btn btn-info">Iniciar Sesión</a>
            </div>
            <div id="usuarioAutenticado" th:if="${session.usuario != null}" >
                <span th:text="|Bienvenido ${session.usuario.getNombre()} ${session.usuario.getApellido()} ${session.rol}|" >Bienvenido ___</span>
                <a class="btn btn-info">Cerrar Sesión</a>
            </div>
        </div>
    </nav>
</body>
</html>
